info:
  name: "03 - health_list"
  type: http
  seq: 3

http:
  method: POST
  url: "{{mcp_host}}/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Authorization
      value: Bearer {{access_token}}
    - name: mcp-session-id
      value: "{{mcp_session_id}}"
    - name: MCP-Protocol-Version
      value: "2025-11-25"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 10,
        "method": "tools/call",
        "params": {
          "name": "health_list",
          "arguments": {
            "limit": 5
          }
        }
      }

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      name: Extract first record ID for next steps
      code: |-
        const body = res.getBody();
        console.log('health_list response:', JSON.stringify(body, null, 2));
        try {
          const result = typeof body === 'string' ? JSON.parse(body) : body;
          // Extract from JSON-RPC result
          if (result.result?.content?.[0]?.text) {
            const toolResult = JSON.parse(result.result.content[0].text);
            if (toolResult.data?.length > 0) {
              const firstId = toolResult.data[0].id;
              bru.setVar('health_record_id', String(firstId));
              console.log('First record ID:', firstId);
            }
          }
        } catch (e) {
          console.log('Could not extract ID:', e.message);
        }
