info:
  name: "06 - health_update"
  type: http
  seq: 6

http:
  method: POST
  url: "{{mcp_host}}/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Authorization
      value: Bearer {{access_token}}
    - name: mcp-session-id
      value: "{{mcp_session_id}}"
    - name: MCP-Protocol-Version
      value: "2025-11-25"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 13,
        "method": "tools/call",
        "params": {
          "name": "health_update",
          "arguments": {
            "id": {{created_record_id}},
            "data": {
              "test": "bruno_mcp_test_UPDATED",
              "updated_at": "{{$timestamp}}"
            }
          }
        }
      }

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
