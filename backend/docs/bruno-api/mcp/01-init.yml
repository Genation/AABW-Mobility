info:
  name: 01 - Initialize
  type: http
  seq: 1

http:
  method: POST
  url: "{{mcp_host}}/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "initialize",
        "params": {
          "protocolVersion": "2025-11-25",
          "capabilities": {
            "roots": {
              "listChanged": true
            },
            "sampling": {}
          },
          "clientInfo": {
            "name": "bruno-test-client",
            "version": "1.0.0"
          }
        }
      }

runtime:
  variables:
    - name: access_token
      value: eyJhbGciOiJFUzI1NiIsImtpZCI6ImI4MTI2OWYxLTIxZDgtNGYyZS1iNzE5LWMyMjQwYTg0MGQ5MCIsInR5cCI6IkpXVCJ9..I05J8ygJTxlty9CfVrVZ5ummSKNEfFIv4KyeJsrBOX2okhyVguBBnl_O_NB4f6a3GKYie1eP910I6tUgvHwKQw
  scripts:
    - type: after-response
      code: |-
        const sessionId = res.getHeader('mcp-session-id');
        if (sessionId) {
          bru.setVar('mcp_session_id', sessionId);
        }
        // Log full response for debugging
        const body = res.getBody();
        console.log('Initialize response:', JSON.stringify(body, null, 2));
        if (sessionId) {
          console.log('Session ID:', sessionId);
        }

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
